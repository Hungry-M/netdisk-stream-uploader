name: build

# 推 tag 时自动打包并建 Release；也可以手动触发只产 artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 建 Release 需要

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-gui.txt
          pip install pyinstaller

      - name: Version check
        shell: pwsh
        run: |
          $code = (python -c "from src.version import __version__; print(__version__)").Trim()
          $tag = (git tag --points-at HEAD | Select-Object -First 1)
          if (-not $tag) {
            Write-Host "不在 tag 上（workflow_dispatch），跳过一致性检查；代码版本 $code"
            exit 0
          }
          if ($tag.TrimStart('v') -ne $code) {
            throw "tag $tag 与 src/version.py $code 不一致"
          }
          Write-Host "版本一致：$tag"

      - name: Check PowerShell scripts have BOM
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 会按 GBK 解析无 BOM 的 UTF-8，
          # 中文注释会把引号吃掉，直接语法错误。这里提前拦下。
          $bad = @()
          Get-ChildItem scripts/*.ps1, packaging/*.ps1 -ErrorAction SilentlyContinue | ForEach-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            $hasNonAscii = [System.Text.Encoding]::UTF8.GetString($b) -match '[^\x00-\x7F]'
            if ($hasNonAscii -and -not $hasBom) { $bad += $_.Name }
          }
          if ($bad.Count -gt 0) { throw "以下 .ps1 含非 ASCII 但缺 BOM：$($bad -join ', ')" }
          Write-Host ".ps1 编码检查通过"

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executables
        shell: pwsh
        run: |
          python -m PyInstaller packaging/streampack.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test exe
        shell: pwsh
        run: |
          .\dist\StreamPack\streampack.exe --help
          if ($LASTEXITCODE -ne 0) { throw "streampack.exe --help 退出码 $LASTEXITCODE" }
          .\dist\StreamPack\streampack.exe --lang en config list
          if ($LASTEXITCODE -ne 0) { throw "streampack.exe config list 退出码 $LASTEXITCODE" }

      - name: Stage portable extras
        shell: pwsh
        run: |
          $dst = "dist/StreamPack"
          Copy-Item README.md, README.zh.md, LICENSE -Destination $dst -Force
          Copy-Item scripts/cleanup.ps1, scripts/cleanup.cmd -Destination $dst -Force
          Copy-Item scripts/uninstall.ps1, scripts/uninstall.cmd -Destination $dst -Force
          Copy-Item scripts/trust-sign.ps1, scripts/trust-sign.cmd -Destination $dst -Force
          Get-ChildItem $dst -File | Select-Object Name, Length

      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "from src.version import __version__; print(__version__)").Trim()
          $env:STREAMPACK_VERSION = $version
          python -m PyInstaller packaging/installer.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/StreamPack-Setup-*.exe | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          $tag = git describe --tags --always
          if (-not $tag) { $tag = "dev" }
          Compress-Archive -Path dist/StreamPack -DestinationPath "dist/StreamPack-$tag-win64.zip"
          Get-Item dist/*.zip | Select-Object Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/*.zip, dist/StreamPack-Setup-*.exe
          $lines = $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPack
          path: |
            dist/*.zip
            dist/StreamPack-Setup-*.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/StreamPack-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
