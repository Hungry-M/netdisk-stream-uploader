name: build

# 推 tag 时自动打包并建 Release；也可以手动触发只产 artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 建 Release 需要

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-gui.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executables
        shell: pwsh
        run: |
          python -m PyInstaller packaging/streampack.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test exe
        shell: pwsh
        run: |
          .\dist\StreamPack\streampack.exe --help
          if ($LASTEXITCODE -ne 0) { throw "streampack.exe --help 退出码 $LASTEXITCODE" }
          .\dist\StreamPack\streampack.exe --lang en config list
          if ($LASTEXITCODE -ne 0) { throw "streampack.exe config list 退出码 $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          $tag = git describe --tags --always
          if (-not $tag) { $tag = "dev" }
          Compress-Archive -Path dist/StreamPack -DestinationPath "dist/StreamPack-$tag-win64.zip"
          Get-Item dist/*.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPack
          path: dist/*.zip
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
